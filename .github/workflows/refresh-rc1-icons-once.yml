name: Refresh RC1 icons package once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-rc1-icons-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved RC1 artifact
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f934-8210-990e-b3073ce219e6/raw?se=2026-11-28T11%3A15%3A19Z&sp=r&sv=2026-06-06&sr=b&scid=6aa95383-e325-5be1-a481-ee68c83a0680&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-28T05%3A02%3A08Z&ske=2026-11-29T05%3A02%3A08Z&sks=b&skv=2026-06-06&sig=Q%2BGuZYyhj1W2NWSx8CA6RHXXTiVQWcmtsFflziaP7DE%3D' --output /tmp/rc1-artifact.zip
          mkdir -p /tmp/rc1
          unzip -q /tmp/rc1-artifact.zip -d /tmp/rc1
      - name: Validate and replace public RC1
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          src=Path('/tmp/rc1/ITControl_Community_RC1.zip')
          assert src.exists()
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              assert z.read('app/VERSION').decode().strip()=='2.0.0-RC1'
              names=set(z.namelist())
              for req in ('app/static/equipment-icons.js','app/static/equipment-icons.css','app/static/office.js','app/static/index.html','app/expenses_module.py'):
                  assert req in names, req
          dst=Path('releases/ITControl_Community_RC1.zip')
          dst.write_bytes(src.read_bytes())
          sha=hashlib.sha256(dst.read_bytes()).hexdigest()
          assert sha=='f679fcafa740f0b3ffe3c085ffa370e2b8aba21e575aa00a4c7883302bb6d322'
          Path('releases/ITControl_Community_RC1.zip.sha256').write_text(sha+'  ITControl_Community_RC1.zip\n',encoding='utf-8')
          print('sha256:',sha)
          PY
      - name: Commit public package
        run: |
          git config user.name "Transcepter Systems CI"
          git config user.email "actions@users.noreply.github.com"
          git add releases/ITControl_Community_RC1.zip releases/ITControl_Community_RC1.zip.sha256
          git diff --cached --quiet || git commit -m "release: refresh Community RC1 equipment icons"
          git push
      - name: Replace GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload RC1             releases/ITControl_Community_RC1.zip             releases/ITControl_Community_RC1.zip.sha256             --clobber             --repo "$GITHUB_REPOSITORY"
