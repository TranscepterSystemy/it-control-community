name: Refresh RC1 release assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-rc1-release-assets-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package before release upload
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          p=Path('releases/ITControl_Community_RC1.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.read('app/VERSION').decode('utf-8').strip() == '2.0.0-RC1'
              names=set(z.namelist())
              assert 'app/expenses_module.py' in names
              assert 'app/static/expenses.js' in names
          expected=Path('releases/ITControl_Community_RC1.zip.sha256').read_text().split()[0]
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          print('validated', actual)
          PY
      - name: Replace assets in GitHub Release RC1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload RC1             releases/ITControl_Community_RC1.zip             releases/ITControl_Community_RC1.zip.sha256             --clobber             --repo "$GITHUB_REPOSITORY"
